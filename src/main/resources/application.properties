# Custom port (default is 8080)
server.port=8081
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/java-hello-db
spring.datasource.username=postgres
spring.datasource.password=

# Let Hibernate create/update tables from the entity classes (learning only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Print the SQL Hibernate runs, so you can see what's happening
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot 2.3 hides error details by default; show them while learning
server.error.include-message=always
server.error.include-binding-errors=always